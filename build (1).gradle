plugins { id 'com.android.application' }

android {
    namespace 'com.tanimsarker.lossless'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tanimsarker.lossless'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path file('../../core/CMakeLists.txt') } }
    sourceSets { main { java.srcDirs = ['src/main/java', '../../shared/java'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
